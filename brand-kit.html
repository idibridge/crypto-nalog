<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>КриптоСдача — LinkedIn Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#fff; display:flex; flex-direction:column; gap:32px; padding:32px; font-family:'Manrope',system-ui,sans-serif; }
.label { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#999; margin-bottom:8px; }

/* LinkedIn banner — точные размеры LinkedIn Company Page: 1128×191px */
.linkedin-banner {
  width:1128px; height:191px;
  background:#22A085;
  border-radius:4px;
  display:flex;
  align-items:center;
  gap:36px;
  padding:0 56px;
  flex-shrink:0;
}

.li-text { flex:1; }
.li-name {
  font-family:'Manrope',system-ui,sans-serif;
  font-weight:800; font-size:42px;
  color:white; letter-spacing:-.03em; line-height:1;
}
.li-tagline {
  font-size:16px; color:rgba(255,255,255,.75);
  margin-top:8px; font-weight:400;
}
.li-url {
  font-size:14px; color:rgba(255,255,255,.5);
  font-weight:600; white-space:nowrap;
}

/* Logo row — white bg */
.logo-row {
  display:flex; gap:24px;
}
.logo-card {
  background:#fff; border:1px solid #e5e5e5; border-radius:12px;
  padding:24px 32px; display:flex; align-items:center; gap:18px;
}
.logo-card.dark { background:#111; border-color:#111; }
.logo-card.green { background:#22A085; border-color:#22A085; }
.wordmark {
  font-family:'Manrope',system-ui,sans-serif;
  font-weight:800; font-size:28px;
  letter-spacing:-.025em; line-height:1; white-space:nowrap;
}
</style>
</head>
<body>

<!-- Hidden SVG defs -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0">
<defs>
<symbol id="icon" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#22A085"/>
  <path d="M20 15 L55 15 L72 32 L72 83 L20 83 Z" fill="white"/>
  <path d="M55 15 L72 15 L72 32 Z" fill="#EBF6F3"/>
  <line x1="55" y1="15" x2="72" y2="32" stroke="#22A085" stroke-opacity="0.12" stroke-width="1.2"/>
  <line x1="28" y1="51" x2="57" y2="51" stroke="#22A085" stroke-width="5" stroke-linecap="round"/>
  <line x1="28" y1="63" x2="49" y2="63" stroke="#22A085" stroke-width="5" stroke-linecap="round"/>
  <circle cx="68" cy="73" r="13" fill="white"/>
  <path d="M61 73.5 L65.5 78 L75 67" stroke="#22A085" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</symbol>
</defs>
</svg>

<!-- Логотипы -->
<div>
  <div class="label">Горизонтальный логотип</div>
  <div class="logo-row">
    <div class="logo-card">
      <svg width="44" height="44"><use href="#icon"/></svg>
      <div class="wordmark">
        <span style="color:#111111">Крипто</span><span style="color:#22A085">Сдача</span>
      </div>
    </div>
    <div class="logo-card">
      <svg width="44" height="44"><use href="#icon"/></svg>
      <div class="wordmark">
        <span style="color:#111111">Crypto</span><span style="color:#22A085">Sdacha</span>
      </div>
    </div>
    <div class="logo-card green">
      <svg width="44" height="44"><use href="#icon"/></svg>
      <div class="wordmark" style="color:white">КриптоСдача</div>
    </div>
    <div class="logo-card dark">
      <svg width="44" height="44"><use href="#icon"/></svg>
      <div class="wordmark" style="color:white">CryptoSdacha</div>
    </div>
  </div>
</div>

<!-- LinkedIn баннер -->
<div>
  <div class="label">LinkedIn Company Banner — 1128×191px (скриншот этого блока)</div>
  <div class="linkedin-banner">
    <svg width="90" height="90"><use href="#icon"/></svg>
    <div class="li-text">
      <div class="li-name">КриптоСдача</div>
      <div class="li-tagline">Налоговый консалтинг по криптовалюте в РФ</div>
    </div>
    <div class="li-url">cryptosdacha.ru</div>
  </div>
</div>

</body>
</html>
